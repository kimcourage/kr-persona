[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kr-persona"
version = "0.5.0"
description = "Synthetic personas of Korean adults built on MatrAIx with Korean survey and census models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# versions used for the reported results: Python 3.13.16, numpy 2.5.3, pandas 3.0.5, scipy 1.18.1, scikit-learn 1.9.1,
# pyarrow 26.0.0, pyreadstat 1.3.7, torch 2.15.0 (CPU), openpyxl 3.1.5, jinja2 3.1.6
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=15",
    "pyreadstat>=1.2",
    "openpyxl>=3.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
estimate = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["krpersona*"]

[tool.setuptools.package-data]
krpersona = ["render/*.json", "render/*.patch", "rules/catalogs/*.json"]
