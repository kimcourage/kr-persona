# 이 파일을 config/paths.toml로 복사한 뒤 실제 절대 경로를 입력합니다.
# 환경 변수 KRP_DATA, KRP_ARTIFACTS, KRP_MATRAIX가 이 설정보다 우선합니다.
# 원자료와 산출물은 저장소 밖에 두는 것을 권장합니다.

# config/data_files.toml에 지정한 원자료 파일이 있는 폴더
data_dir = "/path/to/data"

# 합성 센서스, 추정 모형, 생성 표본과 검증 결과를 저장할 폴더
artifacts_dir = "/path/to/artifacts"

# MatrAIx 저장소 위치: 기준 커밋 3633d8dab149a9482a71b024418a49ae828cc941
matraix_dir = "/path/to/MatrAIx-Persona-8B"
